<div class="verse"><p>The secret of the stars﻿—gravitation.<br>The secret of the earth﻿—layers of rock.<br>The secret of the soil﻿—to receive seed.<br>The secret of the seed﻿—the germ.<br>The secret of man﻿—the sower.<br>The secret of woman﻿—the soil.<br>My secret: Under a mound that you shall never find.</p>
</div>
