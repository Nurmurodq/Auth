<div class="verse"><p>All the words that I gather,<br><span class="i1">And all the words that I write,</span><br>Must spread out their wings untiring,<br><span class="i1">And never rest in their flight,</span><br>Till they come where your sad, sad heart is,<br><span class="i1">And sing to you in the night,</span><br>Beyond where the waters are moving,<br><span class="i1">Storm darkened or starry bright.</span></p>
</div>
