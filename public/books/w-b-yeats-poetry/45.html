<div class="verse"><p>Although you hide in the ebb and flow<br>Of the pale tide when the moon has set,<br>The people of coming days will know<br>About the casting out of my net,<br>And how you have leaped times out of mind<br>Over the little silver cords,<br>And think that you were hard and unkind,<br>And blame you with many bitter words.</p>
</div>
