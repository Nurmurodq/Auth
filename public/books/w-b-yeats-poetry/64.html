<div class="verse"><p>I wander by the edge<br>Of this desolate lake<br>Where wind cries in the sedge:<br>Until the axle break<br>That keeps the stars in their round,<br>And hands hurl in the deep<br>The banners of East and West,<br>And the girdle of light is unbound,<br>Your breast will not lie by the breast<br>Of your beloved in sleep.</p>
</div>
