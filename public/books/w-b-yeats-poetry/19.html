<div class="verse"><p>I pray that I ever be weaving<br><span class="i1">An intellectual tune,</span><br>But weaving it out of threads<br><span class="i1">From the distaff of the moon.</span></p>
<p>Wisdom and dreams are one,<br><span class="i1">For dreams are the flowers ablow,</span><br>And Wisdom the fruit of the garden:<br><span class="i1">God planted him long ago.</span></p>
</div>
