<div class="verse"><p>Out of a fired ship, which by no way<br>But drowning could be rescued from the flame,<br>Some men leap’d forth, and ever as they came<br>Near the foes’ ships, did by their shot decay;<br>So all were lost, which in the ship were found,<br><span class="i1">They in the sea being burnt, they in the burnt ship drowned.</span></p>
</div>
