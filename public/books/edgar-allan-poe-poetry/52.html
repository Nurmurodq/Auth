<div class="verse"><p>Thou wouldst be loved?﻿—then let thy heart<br><span class="i1">From its present pathway part not;</span><br>Being everything which now thou art,<br><span class="i1">Be nothing which thou art not.</span><br>So with the world thy gentle ways,<br><span class="i1">Thy grace, thy more than beauty,</span><br>Shall be an endless theme of praise,<br><span class="i1">And love a simple duty.</span></p>
</div>
