<div class="verse"><p>I heed not that my earthly lot<br><span class="i1">Hath﻿—little of Earth in it﻿—</span><br>That years of love have been forgot<br><span class="i1">In the hatred of a minute:﻿—</span><br>I mourn not that the desolate<br><span class="i1">Are happier, sweet, than I,</span><br>But that <em>you</em> sorrow for <em>my</em> fate<br><span class="i1">Who am a passer-by.</span></p>
</div>
