<div class="verse"><p>As the Greek’s signal flame, by antique records told,<br>Rose from the hill-top, like applause and glory,<br>Welcoming in fame some special veteran, hero,<br>With rosy tinge reddening the land he’d served,<br>So I aloft from Mannahatta’s ship-fringed shore,<br>Lift high a kindled brand for thee, Old Poet.</p>
</div>
