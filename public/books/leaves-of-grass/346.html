<div class="verse"><p>In some unused lagoon, some nameless bay,<br>On sluggish, lonesome waters, anchor’d near the shore,<br>An old, dismasted, gray and batter’d ship, disabled, done,<br>After free voyages to all the seas of earth, haul’d up at last and hawser’d tight,<br>Lies rusting, mouldering.</p>
</div>
