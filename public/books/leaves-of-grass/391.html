<div class="verse"><p>Full of wickedness, I﻿—of many a smutch’d deed reminiscent﻿—of worse deeds capable,<br>Yet I look composedly upon nature, drink day and night the joys of life, and await death with perfect equanimity,<br>Because of my tender and boundless love for him I love and because of his boundless love for me.</p>
</div>
