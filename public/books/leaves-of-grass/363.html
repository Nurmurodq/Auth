<div class="verse"><p>After a long, long course, hundreds of years, denials,<br>Accumulations, rous’d love and joy and thought,<br>Hopes, wishes, aspirations, ponderings, victories, myriads of readers,<br>Coating, compassing, covering﻿—after ages’ and ages’ encrustations,<br>Then only may these songs reach fruition.</p>
</div>
