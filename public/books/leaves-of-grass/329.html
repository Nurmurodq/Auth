<div class="verse"><p>Here first the duties of to-day, the lessons of the concrete,<br>Wealth, order, travel, shelter, products, plenty;<br>As of the building of some varied, vast, perpetual edifice,<br>Whence to arise inevitable in time, the towering roofs, the lamps,<br>The solid-planted spires tall shooting to the stars.</p>
</div>
