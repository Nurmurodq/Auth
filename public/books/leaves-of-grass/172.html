<div class="verse"><p>O tan-faced prairie-boy,<br>Before you came to camp came many a welcome gift,<br>Praises and presents came and nourishing food, till at last among the recruits,<br>You came, taciturn, with nothing to give﻿—we but look’d on each other,<br>When lo! more than all the gifts of the world you gave me.</p>
</div>
