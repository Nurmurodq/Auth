<div class="verse"><p>I stand as on some mighty eagle’s beak,<br>Eastward the sea absorbing, viewing, (nothing but sea and sky,)<br>The tossing waves, the foam, the ships in the distance,<br>The wild unrest, the snowy, curling caps﻿—that inbound urge and urge of waves,<br>Seeking the shores forever.</p>
</div>
