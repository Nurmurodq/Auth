<div class="verse"><p>Fast-anchor’d eternal O love! O woman I love!<br>O bride! O wife! more resistless than I can tell, the thought of you!<br>Then separate, as disembodied or another born,<br>Ethereal, the last athletic reality, my consolation,<br>I ascend, I float in the regions of your love O man,<br>O sharer of my roving life.</p>
</div>
