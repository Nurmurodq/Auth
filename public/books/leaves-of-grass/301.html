<div class="verse"><p>Did we count great, O soul, to penetrate the themes of mighty books,<br>Absorbing deep and full from thoughts, plays, speculations?<br>But now from thee to me, caged bird, to feel thy joyous warble,<br>Filling the air, the lonesome room, the long forenoon,<br>Is it not just as great, O soul?</p>
</div>
