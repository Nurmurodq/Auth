<div class="verse"><p>While not the past forgetting,<br>To-day, at least, contention sunk entire﻿—peace, brotherhood uprisen;<br>For sign reciprocal our Northern, Southern hands,<br>Lay on the graves of all dead soldiers, North or South,<br>(Nor for the past alone﻿—for meanings to the future,)<br>Wreaths of roses and branches of palm.</p>
</div>
