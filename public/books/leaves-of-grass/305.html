<div class="verse"><p>Centre of equal daughters, equal sons,<br>All, all alike endear’d, grown, ungrown, young or old,<br>Strong, ample, fair, enduring, capable, rich,<br>Perennial with the Earth, with Freedom, Law and Love,<br>A grand, sane, towering, seated Mother,<br>Chair’d in the adamant of Time.</p>
</div>
