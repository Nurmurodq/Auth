<div class="verse"><p>Greater than memory of Achilles or Ulysses,<br>More, more by far to thee than tomb of Alexander,<br>Those cart loads of old charnel ashes, scales and splints of mouldy bones,<br>Once living men﻿—once resolute courage, aspiration, strength,<br>The stepping stones to thee to-day and here, America.</p>
</div>
